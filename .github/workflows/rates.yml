# Раз в сутки кладёт на сайт свежие курсы валют (формат open.er-api.com),
# приложение Yrys берёт файл по кнопке «Загрузить из интернета».
name: rates
on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates
        run: |
          curl -fsS --retry 3 https://open.er-api.com/v6/latest/USD -o rates.new
          python3 -c "import json;d=json.load(open('rates.new'));assert d['result']=='success' and 'KZT' in d['rates'];json.dump({'base_code':d['base_code'],'time_last_update_unix':d['time_last_update_unix'],'rates':d['rates']},open('rates.json','w'),separators=(',',':'))"
          rm rates.new
      # Цена грамма золота и серебра в USD — для кнопки «Подставить сегодняшнюю цену»
      # в закяте (источник тот же, что у калькулятора на сайте). Не ответил — оставляем
      # вчерашние цены из прошлого rates.json, курсы валют обновляются всё равно.
      - name: Fetch gold and silver
        run: |
          git show HEAD:rates.json > rates.old 2>/dev/null || echo '{}' > rates.old
          python3 - <<'PY'
          import json, time, urllib.request
          OZ = 31.1034768
          out = json.load(open('rates.json'))
          try:
              def usd_per_gram(sym):
                  req = urllib.request.Request('https://api.gold-api.com/price/' + sym, headers={'User-Agent': 'rates-bot'})
                  p = json.load(urllib.request.urlopen(req, timeout=20))['price']
                  assert 1 < p < 100000
                  return round(p / OZ, 4)
              out['metals'] = {'unit': 'g', 'XAU': usd_per_gram('XAU'), 'XAG': usd_per_gram('XAG'), 'time_unix': int(time.time())}
          except Exception as e:
              print('metals: keep previous —', e)
              old = json.load(open('rates.old')).get('metals')
              if old: out['metals'] = old
          json.dump(out, open('rates.json', 'w'), separators=(',', ':'))
          PY
          rm rates.old
      - name: Commit
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Курсы валют $(date -u +%F)" && git push)
